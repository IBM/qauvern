[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qauvern"
version = "0.12.0"
description = "IBM Quantum load balancer for optimizing instance allocations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "IBM Quantum Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/ibm/qauvern"
Repository = "https://github.com/ibm/qauvern"
Changelog = "https://github.com/ibm/qauvern/blob/main/CHANGELOG.md"

[project.scripts]
qauvern = "qauvern.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.4.0",
    "ty==0.0.74",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["UP"]
ignore = [
    "BLE001",             # Do not catch blind exception
    "TRY002",             # Create your own exception
]
