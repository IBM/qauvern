# qauvern configuration example
#
# Note: All instances must belong to the specified account and plan.

# IBM Cloud Account ID
account_id: "your-account-id-here"

# Plan - all instances in this config must belong to this plan.
# One of: internal, premium, paygo.
plan: "premium"

# Minimum allocation in seconds to maintain for each instance.
# This ensures inactive instances maintain a baseline allocation.
minimum_allocation_seconds: 60

# Optional: Hold back a percentage of account allocation from rebalancing.
# The reserved amount stays unallocated (not distributed to any instance).
# Useful when clients prefer to manage consumption via limits rather than saturating allocations.
# Must be in range [0, 100). Defaults to 0 (no reserve, existing behavior).
# allocation_reserve_percent: 20

# Balance period - the time frame for optimization
balance_period:
  start_date: "2026-01-01T00:00:00+00:00"
  end_date: "2026-12-31T23:59:59+00:00"

instances:
  - name: "Quantum Chemistry Research"
    # Service instance CRN
    crn: "crn:v1:bluemix:public:quantum-computing:us-east:a/abc123:instance-1::"
    # Optional: Override balance period for this instance
    # start_date: "2026-01-01T00:00:00+00:00"
    # end_date: "2026-06-30T23:59:59+00:00"

    # Optional: Base limit for this instance.
    # When set, the optimizer applies this limit on every run.
    # limit_seconds: 216000  # 60 hours

    # Optional: Grant additional time above limit_seconds.
    # Pre-grant usage that exceeded limit_seconds decays out of the effective
    # limit as those days exit the 28-day rolling window.
    # Multiple grants stack. Limit snaps back to limit_seconds after end_date.
    # end_date is optional; defaults to start_date + 28 days if omitted.
    # net_grants:
    #   - start_date: "2026-05-01T00:00:00+00:00"
    #     net_grant_seconds: 360000  # 100 extra hours, default 28-day window
    #   - start_date: "2026-06-15T00:00:00+00:00"
    #     end_date: "2026-07-31T00:00:00+00:00"
    #     net_grant_seconds: 180000  # 50 extra hours until July 31

  - name: "Quantum Machine Learning"
    crn: "crn:v1:bluemix:public:quantum-computing:us-east:a/abc123:instance-2::"
    limit_seconds: 108000  # 30 hours (~0.625 QAU)

  - name: "Quantum Optimization"
    crn: "crn:v1:bluemix:public:quantum-computing:us-east:a/abc123:instance-3::"
    limit_seconds: 72000  # 20 hours (~0.417 QAU)

  - name: "Educational Projects"
    crn: "crn:v1:bluemix:public:quantum-computing:us-east:a/abc123:instance-4::"
