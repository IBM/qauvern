# Simple qauvern configuration
#
# Note: All instances must belong to the specified account and plan.

account_id: "my-ibm-cloud-account-id"
plan: "premium"  # one of: internal, premium, paygo

# Minimum allocation to maintain for each instance.
minimum_allocation_seconds: 60

balance_period:
  start_date: "2026-01-01T00:00:00+00:00"
  end_date: "2026-12-31T23:59:59+00:00"

instances:
  - name: "Research Project A"
    crn: "crn:v1:bluemix:public:quantum-computing:us-east:a/123:inst-a1::"

  - name: "Research Project B"
    crn: "crn:v1:bluemix:public:quantum-computing:us-east:a/123:inst-b1::"
    # Optional: hard cap applied on every run (30 hours)
    limit_seconds: 108000
